<html>
<head>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <style>
    .contact-card { width: 7%; margin: 5% auto; padding: 30px; display: flex; gap: 40px; align-items: center; }
    .contact-card img { width: 260px; }
    .contact-info h1 { color: darkblue; margin-bottom: 20px; }
    .contact-info p { font-size: 1.2em; margin: 8px 0; }
    .contact-info .label { font-weight: bold; color: darkturquoise; }

</head>

      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger;" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" style="font-size: larger;" aria-current="page" href="/contact">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
